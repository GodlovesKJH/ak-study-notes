<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 707 771" width="707" height="771" role="img" aria-label="족궐음간경 · 오수혈 5혈"><title>족궐음간경 · 오수혈 5혈</title><style>:root{--skin:#F4E6D8;--edge:#8A6B55;--crease:#C4A68E;--txt:#1D2A33;--sub:#5B6870;--mk:#C0392B;--line:#8E9AA1;--bg:#FAFAF7}@media (prefers-color-scheme:dark){:root{--skin:#4A3E36;--edge:#B79A83;--crease:#76655A;--txt:#E4E8E6;--sub:#9AA6AC;--mk:#FF8A78;--line:#7D8990;--bg:#14191C}}text{font-family:'IBM Plex Sans KR','Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.t{font-size:19px;font-weight:700;fill:var(--txt)}.st{font-size:13px;fill:var(--sub)}.n{font-size:16px;font-weight:700;fill:var(--txt)}.d{font-size:13px;fill:var(--sub)}.e{fill:var(--edge);stroke:var(--edge);stroke-linecap:round;stroke-linejoin:round}.s{fill:var(--skin);stroke:var(--skin);stroke-linecap:round;stroke-linejoin:round}.cr{fill:none;stroke:var(--crease);stroke-width:1.6;stroke-linecap:round}.ds{stroke-dasharray:4 4}.ld{stroke:var(--line);stroke-width:1;fill:none}.mk{fill:var(--mk);stroke:var(--bg);stroke-width:1.5}.mn{font-size:10.5px;font-weight:700;fill:#fff;text-anchor:middle}
