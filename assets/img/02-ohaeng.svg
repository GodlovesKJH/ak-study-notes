<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" role="img" aria-label="오행의 상생과 상극: 목화토금수가 시계 방향으로 서로 낳고, 별 모양으로 서로 누른다"><title>오행의 상생과 상극</title><style>:root{--bg:#FAFAF7;--txt:#1D2A33;--sub:#5B6870;--edge:#8A6B55;--sheng:#2F6F6A;--ke:#B0452F;--wood:#CFE3C9;--fire:#F2C9C0;--earth:#F0E2B5;--metal:#E1E4E6;--water:#C5D9EA}@media (prefers-color-scheme:dark){:root{--bg:#14191C;--txt:#E4E8E6;--sub:#9AA6AC;--edge:#B79A83;--sheng:#7FC1B8;--ke:#FF8A78;--wood:#2F4A33;--fire:#5A2F29;--earth:#54481F;--metal:#3C4448;--water:#2A3F52}}text{font-family:'IBM Plex Sans KR','Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;text-anchor:middle}.t{font-size:19px;font-weight:700;fill:var(--txt);text-anchor:start}.st{font-size:13px;fill:var(--sub);text-anchor:start}.nm{font-size:21px;font-weight:700;fill:var(--txt)}.sm{font-size:13px;fill:var(--txt)}.lg{font-size:14px;fill:var(--txt);text-anchor:start}.sh{stroke:var(--sheng);stroke-width:3.2;fill:none}.ke{stroke:var(--ke);stroke-width:2;fill:none;stroke-dasharray:7 5}.nd{stroke:var(--edge);stroke-width:2}</style><defs><marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--sheng)"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ke)"/></marker></defs><rect width="100%" height="100%" fill="var(--bg)"/><text class="t" x="20" y="30">오행의 상생·상극</text><text class="st" x="20" y="50">시계 방향이 계절의 순서 · 직접 그린 개략도</text><line class="ke" x1="339.2" y1="164.0" x2="415.5" y2="398.8" marker-end="url(#ak)"/><line class="ke" x1="384.5" y1="421.3" x2="184.7" y2="276.2" marker-end="url(#ak)"/><line class="ke" x1="196.5" y1="239.7" x2="443.5" y2="239.7" marker-end="url(#ak)"/><line class="ke" x1="455.3" y1="276.2" x2="255.5" y2="421.3" marker-end="url(#ak)"/><line class="ke" x1="224.5" y1="398.8" x2="300.8" y2="164.0" marker-end="url(#ak)"/><path class="sh" d="M370.2 141.4Q432.7 144.9 455.3 203.3" marker-end="url(#as)"/><path class="sh" d="M486.3 298.7Q502.4 359.3 453.8 398.8" marker-end="url(#as)"/><path class="sh" d="M372.6 457.8Q320.0 491.8 267.4 457.8" marker-end="url(#as)"/><path class="sh" d="M186.2 398.8Q137.6 359.3 153.7 298.7" marker-end="url(#as)"/><path class="sh" d="M184.7 203.3Q207.3 144.9 269.8 141.4" marker-end="url(#as)"/><circle class="nd" cx="320.0" cy="105.0" r="58" fill="var(--wood)"/><text class="nm" x="320.0" y="97.0">木 목</text><text class="sm" x="320.0" y="118.0">봄</text><text class="sm" x="320.0" y="136.0">간·담</text><circle class="nd" cx="505.5" cy="239.7" r="58" fill="var(--fire)"/><text class="nm" x="505.5" y="231.7">火 화</text><text class="sm" x="505.5" y="252.7">여름</text><text class="sm" x="505.5" y="270.7">심·소장</text><circle class="nd" cx="434.6" cy="457.8" r="58" fill="var(--earth)"/><text class="nm" x="434.6" y="449.8">土 토</text><text class="sm" x="434.6" y="470.8">장하</text><text class="sm" x="434.6" y="488.8">비·위</text><circle class="nd" cx="205.4" cy="457.8" r="58" fill="var(--metal)"/><text class="nm" x="205.4" y="449.8">金 금</text><text class="sm" x="205.4" y="470.8">가을</text><text class="sm" x="205.4" y="488.8">폐·대장</text><circle class="nd" cx="134.5" cy="239.7" r="58" fill="var(--water)"/><text class="nm" x="134.5" y="231.7">水 수</text><text class="sm" x="134.5" y="252.7">겨울</text><text class="sm" x="134.5" y="270.7">신·방광</text><line class="sh" x1="40" y1="586" x2="100" y2="586" marker-end="url(#as)"/><text class="lg" x="110" y="591">상생: 낳아 주고 키움 (목→화→토→금→수→목)</text><line class="ke" x1="40" y1="610" x2="100" y2="610" marker-end="url(#ak)"/><text class="lg" x="110" y="615">상극: 지나치지 않게 눌러 줌 (목→토→수→화→금→목)</text></svg>