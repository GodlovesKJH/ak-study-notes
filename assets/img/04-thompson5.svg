<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 722" width="760" height="722" font-family="Noto Sans KR, Noto Sans CJK KR, sans-serif"><rect width="100%" height="100%" rx="14" fill="#f7fbff" stroke="#c9dcef"/><text x="24" y="38" font-size="20" font-weight="700" fill="#1e3a5f">톰슨 다섯 유형: 엎드린 자세의 다리 길이</text><text x="24" y="62" font-size="12.5" fill="#4a6280">막대 = 두 다리(왼·오른), 아래 끝 = 뒤꿈치. 짧은 다리는 뒤꿈치가 위로 올라와 있습니다. 개략도입니다.</text><text x="250" y="80" font-size="13" font-weight="700" fill="#1e3a5f" text-anchor="middle">① 무릎 편 상태</text><text x="400" y="80" font-size="13" font-weight="700" fill="#1e3a5f" text-anchor="middle">② 90° 굽힘</text><rect x="14" y="92" width="732" height="108" rx="10" fill="#eaf3fc"/><text x="30" y="134" font-size="22" font-weight="800" fill="#1e5aa8">CS</text><text x="30" y="156" font-size="11.5" fill="#4a6280">경추 증후군</text><rect x="224" y="102" width="16" height="70" rx="7" fill="#5b8fd0"/><text x="232" y="188" font-size="10.5" fill="#4a6280" text-anchor="middle">왼</text><rect x="260" y="102" width="16" height="56" rx="7" fill="#5b8fd0"/><text x="268" y="188" font-size="10.5" fill="#4a6280" text-anchor="middle">오른</text><line x1="216" y1="172" x2="284" y2="172" stroke="#9fb6cf" stroke-dasharray="3 3"/><text x="400" y="144" font-size="12" fill="#7a8ea6" text-anchor="middle">(① 위치에서 판정)</text><text x="490" y="124" font-size="12" fill="#b0571c" font-weight="700">고개 돌리기 검사</text><text x="490" y="146" font-size="13" fill="#1e3a5f">고개를 돌리면 짧은 다리가 길어짐</text><rect x="14" y="210" width="732" height="108" rx="10" fill="#ffffff"/><text x="30" y="252" font-size="22" font-weight="800" fill="#1e5aa8">+D</text><text x="30" y="274" font-size="11.5" fill="#4a6280">Positive Derifield</text><rect x="224" y="220" width="16" height="70" rx="7" fill="#5b8fd0"/><text x="232" y="306" font-size="10.5" fill="#4a6280" text-anchor="middle">왼</text><rect x="260" y="220" width="16" height="56" rx="7" fill="#5b8fd0"/><text x="268" y="306" font-size="10.5" fill="#4a6280" text-anchor="middle">오른</text><line x1="216" y1="290" x2="284" y2="290" stroke="#9fb6cf" stroke-dasharray="3 3"/><rect x="374" y="220" width="16" height="70" rx="7" fill="#7fb3e6"/><text x="382" y="306" font-size="10.5" fill="#4a6280" text-anchor="middle">왼</text><rect x="410" y="220" width="16" height="70" rx="7" fill="#7fb3e6"/><text x="418" y="306" font-size="10.5" fill="#4a6280" text-anchor="middle">오른</text><line x1="366" y1="290" x2="434" y2="290" stroke="#9fb6cf" stroke-dasharray="3 3"/><text x="490" y="264" font-size="13" fill="#1e3a5f">굽히면 같아지거나 길어짐</text><rect x="14" y="328" width="732" height="108" rx="10" fill="#eaf3fc"/><text x="30" y="370" font-size="22" font-weight="800" fill="#1e5aa8">−D</text><text x="30" y="392" font-size="11.5" fill="#4a6280">Negative Derifield</text><rect x="224" y="338" width="16" height="70" rx="7" fill="#5b8fd0"/><text x="232" y="424" font-size="10.5" fill="#4a6280" text-anchor="middle">왼</text><rect x="260" y="338" width="16" height="56" rx="7" fill="#5b8fd0"/><text x="268" y="424" font-size="10.5" fill="#4a6280" text-anchor="middle">오른</text><line x1="216" y1="408" x2="284" y2="408" stroke="#9fb6cf" stroke-dasharray="3 3"/><rect x="374" y="338" width="16" height="70" rx="7" fill="#7fb3e6"/><text x="382" y="424" font-size="10.5" fill="#4a6280" text-anchor="middle">왼</text><rect x="410" y="338" width="16" height="56" rx="7" fill="#7fb3e6"/><text x="418" y="424" font-size="10.5" fill="#4a6280" text-anchor="middle">오른</text><line x1="366" y1="408" x2="434" y2="408" stroke="#9fb6cf" stroke-dasharray="3 3"/><text x="490" y="382" font-size="13" fill="#1e3a5f">굽혀도 여전히 짧음 · 통점 4곳</text><rect x="14" y="446" width="732" height="108" rx="10" fill="#ffffff"/><text x="30" y="488" font-size="22" font-weight="800" fill="#1e5aa8">X-D</text><text x="30" y="510" font-size="11.5" fill="#4a6280">X-Derifield</text><rect x="224" y="456" width="16" height="70" rx="7" fill="#5b8fd0"/><text x="232" y="542" font-size="10.5" fill="#4a6280" text-anchor="middle">왼</text><rect x="260" y="456" width="16" height="70" rx="7" fill="#5b8fd0"/><text x="268" y="542" font-size="10.5" fill="#4a6280" text-anchor="middle">오른</text><line x1="216" y1="526" x2="284" y2="526" stroke="#9fb6cf" stroke-dasharray="3 3"/><rect x="374" y="456" width="16" height="70" rx="7" fill="#7fb3e6"/><text x="382" y="542" font-size="10.5" fill="#4a6280" text-anchor="middle">왼</text><rect x="410" y="456" width="16" height="56" rx="7" fill="#7fb3e6"/><text x="418" y="542" font-size="10.5" fill="#4a6280" text-anchor="middle">오른</text><line x1="366" y1="526" x2="434" y2="526" stroke="#9fb6cf" stroke-dasharray="3 3"/><text x="490" y="478" font-size="12" fill="#b0571c" font-weight="700">고개 돌리기 검사</text><text x="490" y="500" font-size="13" fill="#1e3a5f">펴면 같고 굽히면 짧아짐</text><rect x="14" y="564" width="732" height="108" rx="10" fill="#eaf3fc"/><text x="30" y="606" font-size="22" font-weight="800" fill="#1e5aa8">BCS</text><text x="30" y="628" font-size="11.5" fill="#4a6280">양측성 경추 증후군</text><rect x="224" y="574" width="16" height="70" rx="7" fill="#5b8fd0"/><text x="232" y="660" font-size="10.5" fill="#4a6280" text-anchor="middle">왼</text><rect x="260" y="574" width="16" height="70" rx="7" fill="#5b8fd0"/><text x="268" y="660" font-size="10.5" fill="#4a6280" text-anchor="middle">오른</text><line x1="216" y1="644" x2="284" y2="644" stroke="#9fb6cf" stroke-dasharray="3 3"/><rect x="374" y="574" width="16" height="70" rx="7" fill="#7fb3e6"/><text x="382" y="660" font-size="10.5" fill="#4a6280" text-anchor="middle">왼</text><rect x="410" y="574" width="16" height="70" rx="7" fill="#7fb3e6"/><text x="418" y="660" font-size="10.5" fill="#4a6280" text-anchor="middle">오른</text><line x1="366" y1="644" x2="434" y2="644" stroke="#9fb6cf" stroke-dasharray="3 3"/><text x="490" y="596" font-size="12" fill="#b0571c" font-weight="700">고개 돌리기 검사</text><text x="490" y="618" font-size="13" fill="#1e3a5f">고개 돌린 쪽 다리가 짧아짐 (양쪽)</text><text x="24" y="704" font-size="11.5" fill="#4a6280">『톰슨테크닉의 임상적 적용』 39–50쪽, 55쪽 정리표를 바탕으로 직접 그림. 짧은 쪽은 예시로 오른쪽에 둠.</text></svg>