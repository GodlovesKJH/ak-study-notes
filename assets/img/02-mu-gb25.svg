<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 576" width="752" height="576" role="img" aria-label="수양체질 · 신경 모혈: 경문"><title>수양체질 · 신경 모혈: 경문</title><style>:root{--skin:#F4E6D8;--edge:#8A6B55;--crease:#C4A68E;--txt:#1D2A33;--sub:#5B6870;--mk:#C0392B;--line:#8E9AA1;--bg:#FAFAF7}@media (prefers-color-scheme:dark){:root{--skin:#4A3E36;--edge:#B79A83;--crease:#76655A;--txt:#E4E8E6;--sub:#9AA6AC;--mk:#FF8A78;--line:#7D8990;--bg:#14191C}}text{font-family:'IBM Plex Sans KR','Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.t{font-size:19px;font-weight:700;fill:var(--txt)}.st{font-size:13px;fill:var(--sub)}.n{font-size:16px;font-weight:700;fill:var(--txt)}.d{font-size:13px;fill:var(--sub)}.e{fill:var(--edge);stroke:var(--edge);stroke-linecap:round;stroke-linejoin:round}.s{fill:var(--skin);stroke:var(--skin);stroke-linecap:round;stroke-linejoin:round}.cr{fill:none;stroke:var(--crease);stroke-width:1.6;stroke-linecap:round}.ds{stroke-dasharray:4 4}.ld{stroke:var(--line);stroke-width:1;fill:none}.mk{fill:var(--mk);stroke:var(--bg);stroke-width:1.5}.mn{font-size:10.5px;font-weight:700;fill:#fff;text-anchor:middle}
</style><rect width="100%" height="100%" fill="var(--bg)"/><text class="t" x="20" y="28">수양체질 · 신경 모혈: 경문</text><text class="st" x="20" y="48">몸 앞쪽에서 본 모습 · 양쪽에 한 쌍 · 1촌 ≈ 엄지 너비</text><defs><g id="b0"><path class="e" stroke-width="3" d="M-26 -6L-30 30C-80 36 -128 50 -146 92C-150 110 -132 124 -122 140C-118 220 -102 300 -100 360C-100 410 -116 450 -122 490L122 490C116 450 100 410 100 360C102 300 118 220 122 140C132 124 150 110 146 92C128 50 80 36 30 30L26 -6Z"/><path class="s" stroke-width="0.6" d="M-26 -6L-30 30C-80 36 -128 50 -146 92C-150 110 -132 124 -122 140C-118 220 -102 300 -100 360C-100 410 -116 450 -122 490L122 490C116 450 100 410 100 360C102 300 118 220 122 140C132 124 150 110 146 92C128 50 80 36 30 30L26 -6Z"/><path class="cr" d="M-18 40C-50 44 -90 54 -124 74"/><path class="cr" d="M18 40C50 44 90 54 124 74"/><path class="cr" d="M0 40L0 232"/><path class="cr ds" d="M-10 232C-50 245 -85 268 -100 296"/><path class="cr ds" d="M10 232C50 245 85 268 100 296"/><ellipse class="cr" cx="0" cy="360" rx="5" ry="7"/><circle class="cr" cx="-64" cy="155" r="5"/><circle class="cr" cx="64" cy="155" r="5"/><path class="cr ds" d="M-22 440L22 440"/><text x="0" y="141" font-size="10" fill="var(--sub)" text-anchor="middle">젖꼭지 높이</text><text x="0" y="226" font-size="10" fill="var(--sub)" text-anchor="middle">명치</text><text x="0" y="388" font-size="10" fill="var(--sub)" text-anchor="middle">배꼽</text><text x="26" y="444" font-size="10" fill="var(--sub)" text-anchor="start">치골 위 모서리</text></g></defs><svg x="234" y="66" width="274" height="454" viewBox="-152 -10 304 504" overflow="hidden"><use href="#b0"/></svg><path class="ld" d="M283.5 379.2L226 379.2"/><text class="n" x="220" y="378.2" text-anchor="end">모혈 · 경문</text><text class="d" x="220" y="393.2" text-anchor="end">GB25</text><text class="d" x="220" y="408.2" text-anchor="end">12번 갈비뼈의 끝. 옆구리</text><text class="d" x="220" y="423.2" text-anchor="end">뒤쪽이라 등 쪽에서 더 잘</text><text class="d" x="220" y="438.2" text-anchor="end">보임(여기서는 가장자리)</text><circle class="mk" cx="283.5" cy="379.2" r="9"/><text class="mn" x="283.5" y="383.0">모</text><circle class="mk" cx="458.1" cy="379.2" r="9"/><text class="mn" x="458.1" y="383.0">모</text><text class="st" x="20" y="564">개략도입니다. 위치는 교재·사암침법 자료와 비교해 확인하세요.</text></svg>