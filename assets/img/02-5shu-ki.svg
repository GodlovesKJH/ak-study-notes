<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 794" width="780" height="794" role="img" aria-label="족소음신경 · 오수혈 5혈"><title>족소음신경 · 오수혈 5혈</title><style>:root{--skin:#F4E6D8;--edge:#8A6B55;--crease:#C4A68E;--txt:#1D2A33;--sub:#5B6870;--mk:#C0392B;--line:#8E9AA1;--bg:#FAFAF7}@media (prefers-color-scheme:dark){:root{--skin:#4A3E36;--edge:#B79A83;--crease:#76655A;--txt:#E4E8E6;--sub:#9AA6AC;--mk:#FF8A78;--line:#7D8990;--bg:#14191C}}text{font-family:'IBM Plex Sans KR','Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.t{font-size:19px;font-weight:700;fill:var(--txt)}.st{font-size:13px;fill:var(--sub)}.n{font-size:16px;font-weight:700;fill:var(--txt)}.d{font-size:13px;fill:var(--sub)}.e{fill:var(--edge);stroke:var(--edge);stroke-linecap:round;stroke-linejoin:round}.s{fill:var(--skin);stroke:var(--skin);stroke-linecap:round;stroke-linejoin:round}.cr{fill:none;stroke:var(--crease);stroke-width:1.6;stroke-linecap:round}.ds{stroke-dasharray:4 4}.ld{stroke:var(--line);stroke-width:1;fill:none}.mk{fill:var(--mk);stroke:var(--bg);stroke-width:1.5}.mn{font-size:10.5px;font-weight:700;fill:#fff;text-anchor:middle}
</style><rect width="100%" height="100%" fill="var(--bg)"/><text class="t" x="20" y="28">족소음신경 · 오수혈 5혈</text><text class="st" x="20" y="48">오른다리 · 안쪽에서 본 모습(앞이 왼쪽) · 1촌 ≈ 엄지 너비 · 맨 아래는 발바닥</text><defs><g id="b0"><path class="e" stroke-width="3" d="M128 -20L132 60C136 160 142 280 150 380C130 395 95 415 60 430C40 436 28 446 32 458C36 468 60 470 90 468L205 462C232 460 242 440 236 420C232 405 214 392 208 378C212 330 252 250 262 160C268 100 262 50 258 -20Z"/><path class="s" stroke-width="0.6" d="M128 -20L132 60C136 160 142 280 150 380C130 395 95 415 60 430C40 436 28 446 32 458C36 468 60 470 90 468L205 462C232 460 242 440 236 420C232 405 214 392 208 378C212 330 252 250 262 160C268 100 262 50 258 -20Z"/><path class="cr" d="M60 432C75 428 90 428 104 432"/><circle class="cr" cx="172" cy="392" r="15"/><circle class="cr" cx="118" cy="424" r="5"/><circle class="cr" cx="190" cy="34" r="21"/><ellipse class="cr" cx="44" cy="446" rx="7" ry="4.5"/><path class="cr" d="M208 378C214 395 214 405 210 418"/></g><g id="b1"><path class="e" stroke-width="3" d="M-32 26C-38 70 -28 120 -22 152C-16 178 16 178 22 152C30 120 38 70 34 32Z"/><path class="e" fill="none" stroke-width="23" d="M-20 14L-20 14"/><path class="e" fill="none" stroke-width="18.0" d="M-3 4L-3 4"/><path class="e" fill="none" stroke-width="17" d="M11 8L11 8"/><path class="e" fill="none" stroke-width="16.0" d="M22 17L22 17"/><path class="e" fill="none" stroke-width="15" d="M31 28L31 28"/><path class="s" stroke-width="0.6" d="M-32 26C-38 70 -28 120 -22 152C-16 178 16 178 22 152C30 120 38 70 34 32Z"/><path class="s" fill="none" stroke-width="20" d="M-20 14L-20 14"/><path class="s" fill="none" stroke-width="15.0" d="M-3 4L-3 4"/><path class="s" fill="none" stroke-width="14" d="M11 8L11 8"/><path class="s" fill="none" stroke-width="13.0" d="M22 17L22 17"/><path class="s" fill="none" stroke-width="12" d="M31 28L31 28"/><path class="cr ds" d="M-34 62L36 62"/></g></defs><svg x="240" y="66" width="290" height="150" viewBox="22 -20 252 1